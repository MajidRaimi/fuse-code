name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run the module unit tests on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File test\FuseCode.Tests.ps1

      - name: Run the module unit tests on PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File test/FuseCode.Tests.ps1

      - name: Check that the bash and PowerShell planners agree
        if: runner.os == 'Linux'
        shell: bash
        run: bash test/planner-parity.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Claude Code
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"

      - name: Show the Claude Code version
        run: claude --version

      - name: Make sure jq is installed
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v jq >/dev/null; then
            if command -v brew >/dev/null; then
              brew install jq
            else
              sudo apt-get update
              sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Run the end-to-end test
        if: runner.os != 'Windows'
        shell: bash
        run: bash test/e2e.sh

      - name: Run the end-to-end test
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File test\e2e.ps1
